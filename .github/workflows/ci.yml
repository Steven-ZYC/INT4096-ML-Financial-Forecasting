name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (temporal integrity, metrics, manifests, notebook)
    runs-on: ubuntu-latest
    steps:
      # Full history: the integrity check below verifies that every run manifest
      # points at a commit that still exists. A shallow clone would make that
      # check vacuous (it previously reported 20 false "dangling" references).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit and integrity tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Prove the leakage suite can fail
        run: python scripts/mutation_check.py

      - name: Verify audit fixes
        run: python scripts/verify_fixes.py

      - name: Verify dataset snapshot hashes
        run: |
          PYTHONPATH=src python - <<'PY'
          from int4096.data.load import resolve_snapshot_path, read_manifest
          from int4096.data.snapshot import sha256_file
          for asset in ("AAPL", "BTC"):
              path = resolve_snapshot_path(asset)
              manifest = read_manifest(asset)
              assert sha256_file(path) == manifest["sha256"], f"{asset} hash drift"
              print(f"{asset}: {manifest['row_count']} rows, hash OK")
          PY

      - name: Check no run manifest references a missing commit
        run: |
          PYTHONPATH=src python - <<'PY'
          import glob, json, subprocess
          dangling = []
          for path in glob.glob("artifacts/experiments/*/manifest.json"):
              commit = json.load(open(path))["git_commit"]
              if subprocess.run(["git", "cat-file", "-e", commit],
                                capture_output=True).returncode != 0:
                  dangling.append((path, commit))
          print(f"dangling commit references: {len(dangling)}")
          for item in dangling:
              print("  ", item)
          if dangling:
              raise SystemExit(
                  "a run manifest references a commit that no longer exists; "
                  "history was rewritten without re-running the experiments"
              )
          print("all manifests reference commits present in this clone")
          PY

  report:
    name: build LaTeX report
    runs-on: ubuntu-latest
    steps:
      # Full history: the integrity check below verifies that every run manifest
      # points at a commit that still exists. A shallow clone would make that
      # check vacuous (it previously reported 20 false "dangling" references).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate figures and tables from run artifacts
        run: PYTHONPATH=src python scripts/build_latex_assets.py

      # texcount must run INSIDE the TeX container: later steps run on the bare
      # runner, which has no TeX installation (an earlier version silently
      # printed "texcount not available" and the count was never checked).
      - name: Compile report and count words
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: reports/latex
          root_file: main.tex
          post_compile: |
            echo "=== texcount (narrative word count) ==="
            # texcount prints one block per file and then the totals, so the
            # totals are the LAST match of each key. Summing all matches would
            # double-count (it produced 4798 instead of 2499 on the first try).
            report=$(texcount -inc -sum main.tex)
            text=$(printf '%s\n' "$report" | awk '/^Words in text:/{t=$4} END{print t+0}')
            heads=$(printf '%s\n' "$report" | awk '/^Words in headers:/{h=$4} END{print h+0}')
            caps=$(printf '%s\n' "$report" | awk '/^Words outside text/{c=$NF} END{print c+0}')
            total=$((text + heads))
            echo "words in text:      $text"
            echo "words in headings:  $heads"
            echo "narrative total:    $total  (allowance ~2500)"
            echo "captions (excluded): $caps"
            if [ "$total" -gt 2500 ]; then
              echo "FAIL: narrative exceeds the ~2500-word allowance"; exit 1
            fi
            echo "OK: narrative within the ~2500-word allowance"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: INT4096_Final_Report
          path: reports/latex/main.pdf
          if-no-files-found: error

      - name: Confirm the compiled PDF is present
        run: |
          test -s reports/latex/main.pdf
          ls -l reports/latex/main.pdf

  slides:
    name: build presentation deck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate slide figures and macros from run artifacts
        run: PYTHONPATH=src python scripts/build_slide_assets.py

      - name: Compile deck
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: slides/latex
          root_file: main.tex
          post_compile: |
            echo "=== deck check ==="
            # pdfinfo is not in the TeX image, so page count comes from the log.
            grep -E "Output written" main.log
            boxes=$(grep -cE "Overfull|Underfull" main.log || true)
            echo "overfull/underfull boxes: ${boxes:-0}"
            test -s main.pdf
            if [ "${boxes:-0}" -gt 0 ]; then
              echo "FAIL: layout overflow in the deck"; grep -E "Overfull|Underfull" main.log; exit 1
            fi
            echo "OK: deck has no layout overflow"

      - name: Upload deck
        uses: actions/upload-artifact@v4
        with:
          name: INT4096_Presentation
          path: slides/latex/main.pdf
          if-no-files-found: error
